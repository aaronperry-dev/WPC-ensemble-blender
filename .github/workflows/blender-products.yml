name: Ensemble Blender products

on:
  schedule:
    # ~6.5 h after each 00/06/12/18Z cycle: GEFS/AIGEFS are long out, ECMWF open data is complete.
    # Odd minutes keep us off the top-of-hour crush on the data servers.
    - cron: "27 6,12,18,0 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Force T0 (YYYYMMDDHH), blank = newest available"
        required: false
      force:
        description: "Rebuild even if this cycle was already built"
        type: boolean
        default: false

concurrency:
  group: blender-products
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Natural Earth shapefiles (cartopy downloads them on first use)
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-ne-v1

      # Decoded-field cache, keyed per cycle so a retried run does not re-download everything
      - uses: actions/cache@v4
        with:
          path: .cache/eb
          key: eb-decode-${{ github.run_id }}
          restore-keys: eb-decode-

      - name: Build products
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.cycle }}" ]; then ARGS="$ARGS --cycle ${{ github.event.inputs.cycle }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python eb_run.py $ARGS --out site/data
          cp products.html site/products.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
